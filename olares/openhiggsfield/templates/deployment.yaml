{{- $domainRaw := default "openhiggsfield.example.olares.com" .Values.domain.openhiggsfield -}}
{{- $domainParts := split "," $domainRaw -}}
{{- $entranceHost := index $domainParts "_0" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openhiggsfield
  namespace: {{ .Release.Namespace }}
  labels:
    app: openhiggsfield
spec:
  replicas: {{ .Values.workloads.openhiggsfield.replicaCount }}
  selector:
    matchLabels:
      app: openhiggsfield
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: openhiggsfield
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: openhiggsfield
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            - name: TRUST_PROXY
              value: "1"
            - name: PUBLIC_ORIGIN
              value: "https://{{ $entranceHost }}"
            - name: NEXT_PUBLIC_SITE_URL
              value: "https://{{ $entranceHost }}"
            - name: UPLOAD_DIR
              value: /tmp/open-higgsfield-uploads
          envFrom:
            - secretRef:
                name: openhiggsfield
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 25
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

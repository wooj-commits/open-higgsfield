name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: wooj-commits/open-higgsfield
  IMAGE_TAG: "0.1.0"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=open-higgsfield
          provenance: false

      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          OWNER="${{ github.repository_owner }}"
          PKG="open-higgsfield"
          if gh api --method PUT "users/${OWNER}/packages/container/${PKG}/visibility" -f visibility=public; then
            echo "Set user-owned GHCR package visibility to public."
            exit 0
          fi
          if gh api --method PUT "orgs/${OWNER}/packages/container/${PKG}/visibility" -f visibility=public; then
            echo "Set org-owned GHCR package visibility to public."
            exit 0
          fi
          echo "::warning::Could not flip GHCR visibility via API. Open GitHub → Packages → open-higgsfield → Package settings → Change visibility → Public. Olares pulls anonymously; a private package would need a cluster pull secret this node does not have."
          exit 0
